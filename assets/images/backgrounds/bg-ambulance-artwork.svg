<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Primary Ambient Volumetric Glow (Right Side / Behind Vehicle Card) -->
    <radialGradient id="ambGlowRight" cx="82%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#39c6c8" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#008794" stop-opacity="0.07" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Soft Underlight (Bottom-Left) -->
    <radialGradient id="ambGlowLeft" cx="15%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#e2f5f7" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#f2fafb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Gentle Top-Left Warm Ivory / Soft Light Diffusion -->
    <radialGradient id="ambGlowTopLeft" cx="10%" cy="15%" r="38%">
      <stop offset="0%" stop-color="#faedd5" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#fdf9f2" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="ambSoftBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="85" />
    </filter>
  </defs>

  <!-- Ambient Light Washes -->
  <rect width="1600" height="900" fill="url(#ambGlowRight)" />
  <rect width="1600" height="900" fill="url(#ambGlowLeft)" />
  <rect width="1600" height="900" fill="url(#ambGlowTopLeft)" />

  <!-- Ultra-soft Translucent Corner Accents -->
  <path d="M1240,-50 C1460,0 1660,110 1620,330 C1580,510 1380,530 1260,420 C1160,320 1140,-90 1240,-50 Z" 
        fill="#c7ecf0" opacity="0.22" filter="url(#ambSoftBlur)" />
  <ellipse cx="160" cy="780" rx="280" ry="180" fill="#d8f3f6" opacity="0.25" filter="url(#ambSoftBlur)" />
</svg>