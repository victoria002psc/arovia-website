<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Pristine Diagnostic Light Bloom (Right Side) -->
    <radialGradient id="labLightBloom" cx="82%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#39c6c8" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#008794" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Scientific Ice Glow (Bottom-Left) -->
    <radialGradient id="labIceGlow" cx="16%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#f0f9ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="labSoftBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="85" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#labLightBloom)" />
  <rect width="1600" height="900" fill="url(#labIceGlow)" />

  <path d="M1240,-40 C1460,0 1660,100 1620,320 C1580,500 1380,520 1260,420 C1160,320 1140,-80 1240,-40 Z" 
        fill="#c4eef5" opacity="0.20" filter="url(#labSoftBlur)" />
  <ellipse cx="180" cy="780" rx="260" ry="180" fill="#d2eff5" opacity="0.25" filter="url(#labSoftBlur)" />
</svg>