<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm Daylight Glow (Left / Content Side) -->
    <radialGradient id="clinicDaylight" cx="18%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#fdf8ec" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Clinical Aqua Glow (Right Side) -->
    <radialGradient id="clinicAquaGlow" cx="82%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#39c6c8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#008794" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="clinicSoftBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="85" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#clinicDaylight)" />
  <rect width="1600" height="900" fill="url(#clinicAquaGlow)" />

  <ellipse cx="1320" cy="300" rx="300" ry="220" fill="#cbeff2" opacity="0.20" filter="url(#clinicSoftBlur)" />
  <ellipse cx="140" cy="220" rx="240" ry="180" fill="#fdeec8" opacity="0.25" filter="url(#clinicSoftBlur)" />
</svg>